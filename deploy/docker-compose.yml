# Local dev stack: Postgres + indexer.
# The Next.js frontend runs on the host (`pnpm --dir web dev`).

services:
  postgres:
    image: postgres:16-alpine
    container_name: ligate-explorer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ligate_explorer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ligate_explorer']
      interval: 5s
      timeout: 3s
      retries: 10

  indexer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.indexer
    container_name: ligate-explorer-indexer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ligate_explorer
      RPC_URL: ${RPC_URL:-http://host.docker.internal:12346}
      RUST_LOG: ligate_indexer=info,sqlx=warn
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  postgres_data:
